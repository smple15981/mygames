name: Validate project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate pure 2D Godot repository contract
        run: python tools/validate_project.py .

      - name: Compile Python validation tools
        run: python -m compileall -q tools tests

      - name: Install official Godot editor
        run: |
          curl --fail --location --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import and parse Godot project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --import 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|^ERROR:" godot-import.log; then
            echo "Godot import reported script/resource errors."
            exit 1
          fi

      - name: Run headless gameplay tests
        shell: bash
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 60s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/godot/test_runner.gd 2>&1 | tee godot-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 124 ]; then
            echo "Headless gameplay tests timed out."
            exit 1
          fi
          if grep -E "SCRIPT ERROR:|^ERROR:" godot-tests.log; then
            echo "Headless gameplay tests reported script/runtime errors."
            exit 1
          fi
          exit "$status"

      - name: Smoke-run the main scene
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --quit-after 8 2>&1 | tee godot-smoke.log
          if grep -E "SCRIPT ERROR:|^ERROR:" godot-smoke.log; then
            echo "Godot main scene reported runtime errors."
            exit 1
          fi

      - name: Capture graphical world validation
        shell: bash
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout 60s xvfb-run -a ./Godot_v4.6.3-stable_linux.x86_64 --audio-driver Dummy --path . --script res://tests/godot/capture_world.gd 2>&1 | tee godot-capture.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 124 ]; then
            echo "Godot screenshot capture timed out."
            exit 1
          fi
          if grep -E "SCRIPT ERROR:|^ERROR:" godot-capture.log; then
            echo "Godot screenshot capture reported errors."
            exit 1
          fi
          test -s artifacts/world-validation.png
          exit "$status"

      - name: Upload graphical validation
        uses: actions/upload-artifact@v4
        with:
          name: world-validation
          path: artifacts/world-validation.png
          if-no-files-found: error
          retention-days: 14
