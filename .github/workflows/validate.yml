name: Validate project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate pure 2D Godot repository contract
        run: python tools/validate_project.py .

      - name: Compile Python validation tools
        run: python -m compileall -q tools tests

      - name: Install official Godot editor
        run: |
          curl --fail --location --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import and parse Godot project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --import 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|^ERROR:" godot-import.log; then
            echo "Godot import reported script/resource errors."
            exit 1
          fi

      - name: Run headless gameplay tests
        run: ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tests/godot/test_runner.gd

      - name: Smoke-run the main scene
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --quit-after 8 2>&1 | tee godot-smoke.log
          if grep -E "SCRIPT ERROR:|^ERROR:" godot-smoke.log; then
            echo "Godot main scene reported runtime errors."
            exit 1
          fi
